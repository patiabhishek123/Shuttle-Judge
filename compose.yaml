services:
  postgres:
    image: postgres:16-alpine
    container_name: shuttle-court-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker_admin
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: shuttle_court
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - shuttle_court_postgres:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker_admin -d shuttle_court"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shuttle_court_postgres:
